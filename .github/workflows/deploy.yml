name: Deploy Gartenverein to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4
        
      - name: SSH Host-Key vorbereiten
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p 22 -H "$SFTP_HOST" > /tmp/ionos_host_keys
          ssh-keygen -lf /tmp/ionos_host_keys


      - name: SFTP Deployment
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" \
            "sftp://$SFTP_HOST:22" <<'EOF'
          set sftp:auto-confirm no
          mirror --reverse --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .gitignore \
            ./ .
          bye
          EOF
