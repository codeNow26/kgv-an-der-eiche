
name: Deploy Gartenverein to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: SFTP Deployment
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p 22 -H "$SFTP_HOST" \
            2>/dev/null > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" \
            "sftp://$SFTP_HOST:22" <<'EOF'
          set sftp:auto-confirm no
          set net:max-retries 2
          mirror --reverse --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .gitignore \
            ./ .
          bye
          EOF
